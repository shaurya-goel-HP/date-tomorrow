<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Date Tomorrow?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Baloo+2:wght@700;800&display=swap">
<style>
  :root{ --ink:#FFE38F; --chalk:#3B1D3A; --chalk-dim:rgba(59,29,58,.75); --yes:#3E9A4E; --yes-deep:#2A6E36; --pink:#E8457F; --sun:#3B1D3A; --mint:#1F8F78 }
  *{box-sizing:border-box}
  body{ margin:0; min-height:100dvh; background:var(--ink);
    background-image:radial-gradient(ellipse 60% 45% at 50% 28%, rgba(255,126,168,.22), transparent 70%); color:var(--chalk); font-family:"Gaegu",cursive;
    display:grid; place-items:center; padding:24px; overflow-x:hidden }
  canvas#doodles{ position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none }
  canvas#hearts{ position:fixed; inset:0; width:100%; height:100%; z-index:4; pointer-events:none }
  main{ position:relative; z-index:2; width:100%; max-width:26rem; text-align:center }
  .sticker{ width:min(230px,58vw); display:block; margin:0 auto 18px; transform:rotate(-4deg);
    border:6px solid #fff; border-radius:22px; box-shadow:0 14px 28px rgba(59,29,58,.28);
    animation:bob 3s ease-in-out infinite }
  @keyframes bob{ 0%,100%{ transform:rotate(-4deg) translateY(0) } 50%{ transform:rotate(-2deg) translateY(-8px) } }
  h1{ font-weight:700; font-size:clamp(2.6rem,11vw,4rem); line-height:.95; margin:0 0 12px; letter-spacing:.01em; text-wrap:balance; color:var(--sun) }
  .promise{ font-size:1.45rem; line-height:1.25; margin:0 0 26px; color:var(--chalk-dim) }
  .promise b{ color:var(--pink); font-weight:700 }
  .btns{ display:flex; gap:16px; justify-content:center; align-items:center; flex-wrap:wrap; min-height:70px }
  button.choice{ font-family:"Baloo 2",sans-serif; font-weight:800; font-size:1.3rem; border:0; cursor:pointer;
    padding:12px 34px; border-radius:16px; transition:transform .15s, font-size .2s }
  button.choice:focus-visible{ outline:3px solid var(--chalk); outline-offset:3px }
  #yes{ background:var(--yes); color:#fff; box-shadow:0 5px 0 var(--yes-deep) }
  #yes:hover{ transform:translateY(-2px) }
  #no{ background:transparent; color:var(--chalk); box-shadow:inset 0 0 0 3px var(--mint) }
  #no.free{ position:fixed; z-index:5; transition:left .25s, top .25s }
  .bubble{ position:fixed; z-index:6; max-width:230px; padding:8px 12px; background:#fff; color:var(--chalk);
    font-family:"Gaegu",cursive; font-weight:700; font-size:1.25rem; line-height:1.15; border-radius:12px; text-align:center;
    box-shadow:0 6px 16px rgba(59,29,58,.3); transition:left .25s, top .25s; pointer-events:none }
  .bubble::after{ content:""; position:absolute; left:50%; bottom:-8px; margin-left:-8px; border:8px solid transparent; border-top-color:#fff; border-bottom:0 }
  .bubble.below::after{ bottom:auto; top:-8px; border-top-color:transparent; border-bottom:8px solid #fff; border-top:0 }
  #done{ display:none }
  .ps{ font-size:1.2rem; color:var(--chalk-dim); margin:18px 0 0 }
  @media (prefers-reduced-motion:reduce){ #no.free,.bubble{transition:none} .sticker{animation:none} }
</style>
</head>
<body>
<canvas id="doodles"></canvas>
<canvas id="hearts"></canvas>
<main>
  <img class="sticker" src="sticker.png" alt="you, laughing">

  <section id="ask">
    <h1>Will you go on a date with me tomorrow?</h1>
    <p class="promise">Asian food. <b>Not too heavy</b> (hopefully). And the gin &amp; tonic I owe you.</p>
    <div class="btns">
      <button class="choice" id="yes">Yes</button>
      <button class="choice" id="no">No</button>
    </div>
  </section>

  <section id="done">
    <h1>It's a date.</h1>
    <p class="promise">Kal milte hain. Noodles or dumplings, your pick. I'll text you the time.</p>
    <p class="ps">(ps: hopefully you looked exactly like this sticker when you said yes 🤞)</p>
  </section>
</main>

<script>
  // ---- faint doodles, drawn once ----
  const dc = document.getElementById('doodles'), dx = dc.getContext('2d');
  function doodles(){
    const dpr = devicePixelRatio || 1; dc.width = innerWidth*dpr; dc.height = innerHeight*dpr; dx.setTransform(dpr,0,0,dpr,0,0);
    dx.clearRect(0,0,innerWidth,innerHeight); dx.lineWidth = 2.2;
    const palette = ['rgba(232,69,127,.45)','rgba(59,29,58,.28)','rgba(31,143,120,.45)','rgba(255,255,255,.7)']; dx.lineCap = 'round'; dx.lineJoin='round';
    let seed = 7; const rnd = () => (seed = (seed*9301+49297) % 233280) / 233280;
    const kinds = [heart, bowl, dumpling, squiggle, star, chopsticks];
    const n = Math.round(innerWidth*innerHeight/26000);
    const cx = innerWidth/2, keep = Math.min(270, innerWidth*.34);
    for (let i=0;i<n;i++){ const x = rnd()*innerWidth, y = rnd()*innerHeight, s = 14 + rnd()*18;
      if (Math.abs(x-cx) < keep && y > innerHeight*.08 && y < innerHeight*.92) continue;
      dx.save(); dx.translate(x,y); dx.rotate((rnd()-.5)*1.2); dx.strokeStyle = palette[i % palette.length]; kinds[i % kinds.length](s); dx.restore(); }
    function heart(r){ dx.beginPath(); dx.moveTo(0,r*.35); dx.bezierCurveTo(-r,-r*.4,-r*.45,-r*1.1,0,-r*.45); dx.bezierCurveTo(r*.45,-r*1.1,r,-r*.4,0,r*.35); dx.stroke(); }
    function bowl(r){ dx.beginPath(); dx.moveTo(-r,0); dx.quadraticCurveTo(0,r*1.3,r,0); dx.closePath(); dx.stroke();
      dx.beginPath(); dx.moveTo(-r*.6,-r*.5); dx.bezierCurveTo(-r*.3,-r*.9,0,-r*.2,r*.3,-r*.8); dx.stroke(); }
    function dumpling(r){ dx.beginPath(); dx.moveTo(-r,r*.3); dx.quadraticCurveTo(0,-r*1.1,r,r*.3); dx.quadraticCurveTo(0,r*.6,-r,r*.3); dx.stroke();
      for (let k=-2;k<=2;k++){ dx.beginPath(); dx.moveTo(k*r*.3,-r*.2); dx.lineTo(k*r*.3+r*.08,-r*.5); dx.stroke(); } }
    function squiggle(r){ dx.beginPath(); dx.moveTo(-r*1.4,0); for (let k=0;k<4;k++) dx.quadraticCurveTo(-r*1.4+r*.7*k+r*.35, (k%2?-1:1)*r*.6, -r*1.4+r*.7*(k+1), 0); dx.stroke(); }
    function star(r){ dx.beginPath(); for (let k=0;k<5;k++){ const a=k*4*Math.PI/5-Math.PI/2; dx[k?'lineTo':'moveTo'](Math.cos(a)*r*.6, Math.sin(a)*r*.6); } dx.closePath(); dx.stroke(); }
    function chopsticks(r){ dx.beginPath(); dx.moveTo(-r*.3,-r*1.2); dx.lineTo(r*.2,r*1.2); dx.moveTo(r*.1,-r*1.2); dx.lineTo(r*.5,r*1.2); dx.stroke(); }
  }
  doodles(); addEventListener('resize', doodles);

  // ---- the hard-to-press No ----
  const no = document.getElementById('no'), yes = document.getElementById('yes');
  const lines = ["come on, I know thoda autistic hu but dil se accha hu",
                 "itna bhi kya naraz kar diya",
                 "arre ab tak toh samajh jao nahi daba paaoge",
                 "you already said yes, I heard it",
                 "the button literally moved. take the hint",
                 "this is getting embarrassing. for you",
                 "I'm not even doing anything, it's moving on its own"];
  const CONVERT_AT = lines.length + 1;
  let dodges = 0, size = 1.3;
  const bubble = document.createElement('div'); bubble.className = 'bubble';
  function say(text, x, y){
    bubble.textContent = text; if (!bubble.isConnected) document.body.appendChild(bubble);
    const bw = bubble.offsetWidth, bh = bubble.offsetHeight;
    let bx = x + no.offsetWidth/2 - bw/2, by = y - bh - 14, below = false;
    bx = Math.max(8, Math.min(bx, innerWidth - bw - 8));
    if (by < 8) { by = y + no.offsetHeight + 14; below = true; }
    bubble.classList.toggle('below', below);
    bubble.style.left = bx + 'px'; bubble.style.top = by + 'px';
  }
  function dodge(){
    dodges++;
    if (!no.classList.contains('free')) { no.classList.add('free'); document.body.appendChild(no); }
    const [x, y] = spot();
    no.style.left = x + 'px'; no.style.top = y + 'px';
    size = Math.min(size + .1, 2.2); yes.style.fontSize = size + 'rem';
    if (dodges < CONVERT_AT) { say(lines[dodges-1], x, y); return; }
    say("okay, that one's a yes now too", x, y);
    no.textContent = 'Yes'; no.id = 'yes2';
    no.style.background = 'var(--yes)'; no.style.color = '#fff'; no.style.boxShadow = '0 5px 0 var(--yes-deep)';
    no.removeEventListener('mouseover', dodge); no.removeEventListener('touchstart', dodgeTouch); no.removeEventListener('click', dodgeClick);
    no.addEventListener('click', sayYes);
  }
  // find a spot that doesn't cover the sticker, the question or the Yes
  function spot(){
    const m = document.querySelector('main').getBoundingClientRect(), pad = 16;
    const w = no.offsetWidth, h = no.offsetHeight, bh = 70;
    const avoid = { l:m.left - pad, r:m.right + pad, t:m.top - pad, b:m.bottom + pad };
    let x, y;
    for (let i = 0; i < 40; i++){
      x = Math.random()*(innerWidth - w - 20) + 10; y = Math.random()*(innerHeight - h - 2*bh) + bh;
      const clash = x < avoid.r && x + w > avoid.l && y - bh < avoid.b && y + h + bh > avoid.t;
      if (!clash) return [x, y];
    }
    return [x, y];
  }
  function dodgeTouch(e){ e.preventDefault(); dodge(); }
  function dodgeClick(e){ e.preventDefault(); dodge(); }
  no.addEventListener('mouseover', dodge);
  no.addEventListener('touchstart', dodgeTouch, {passive:false});
  no.addEventListener('click', dodgeClick);

  function sayYes(){
    document.getElementById('ask').style.display = 'none'; no.remove(); bubble.remove();
    document.getElementById('done').style.display = 'block'; burst();
  }
  yes.addEventListener('click', sayYes);

  // ---- hearts on yes ----
  const cv = document.getElementById('hearts'), ctx = cv.getContext('2d');
  function fit(){ cv.width = innerWidth*devicePixelRatio; cv.height = innerHeight*devicePixelRatio; ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); }
  fit(); addEventListener('resize', fit);
  const cols = ['#E8457F','#FFFFFF','#3E9A4E','#3B1D3A'];
  let parts = [];
  function burst(){
    for (let i=0;i<170;i++) parts.push({ x:innerWidth/2, y:innerHeight/2, vx:(Math.random()-.5)*16, vy:-Math.random()*16-4,
      r:6+Math.random()*10, c:cols[i%cols.length], a:Math.random()*6.28, va:(Math.random()-.5)*.3 });
    requestAnimationFrame(tick);
  }
  function heartShape(x,y,r,a,c){ ctx.save(); ctx.translate(x,y); ctx.rotate(a); ctx.fillStyle=c; ctx.beginPath();
    ctx.moveTo(0,r*.3); ctx.bezierCurveTo(-r,-r*.5,-r*.4,-r*1.1,0,-r*.4); ctx.bezierCurveTo(r*.4,-r*1.1,r,-r*.5,0,r*.3); ctx.fill(); ctx.restore(); }
  function tick(){
    ctx.clearRect(0,0,innerWidth,innerHeight);
    parts = parts.filter(p => p.y < innerHeight+30);
    for (const p of parts){ p.vy += .35; p.x += p.vx; p.y += p.vy; p.vx *= .99; p.a += p.va; heartShape(p.x,p.y,p.r,p.a,p.c); }
    if (parts.length) requestAnimationFrame(tick);
  }
</script>
</body>
</html>
